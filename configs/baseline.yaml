# Scorer A — baseline klasik (fitur bentuk/warna → scikit-learn), supervised normal + kempes.
seed: 42

data:
  normal_dir: train-data/good-loaf   # label normal (foto dari user, di-commit)
  defect_dir: train-data/bad-loaf    # label defect (kempes)
  manifest: train-data/manifest.csv  # split dibekukan; buat ulang hanya dengan --force
  extensions: [.png, .jpg, .jpeg]
  split_by: batch_id          # split per batch/sesi, BUKAN acak per gambar
  split: {train: 0.70, val: 0.15, test: 0.15}
  near_dup_hamming: 5         # dHash 64-bit; jarak <= ini = near-duplicate → dipaksa satu split

audit:                        # python -m loaflens.audit
  report: outputs/audit.md
  docs_copy: docs/audit_m1.md # salinan ber-versi (tanpa gambar); null = tidak disalin
  border_frac: 0.05           # lebar tepi (fraksi sisi) untuk statistik warna latar
  center_frac: 0.5            # kotak tengah (fraksi sisi) untuk statistik warna roti
  shortcut_acc: 0.9           # WARNING jika 1 fitur trivial memisahkan kelas dgn akurasi >= ini
  pair_warn_ratio: 0.6        # WARNING jika nama bernomor sama (mis. a (3)/b (3)) jauh lebih mirip
  min_eval_per_class: 30      # WARNING jika val/test per label < ini (metrik terlalu noisy)

camera:
  view: top                   # top | oblique (miring ~45°)
  roi: null                   # [x, y, w, h] fraksi frame 0–1; null = seluruh frame

segment: {}                   # placeholder — diisi di M4

track:
  direction: left_to_right    # left_to_right | right_to_left | top_to_bottom | bottom_to_top
  line_pos: 0.5               # garis keputusan, fraksi frame searah gerak konveyor

model:
  type: baseline
  train_labels: [normal, defect]
  params:                     # belum dipakai — M2
    classifier: random_forest
    n_estimators: 200

threshold: 50                 # skor 0–100; REJECT jika skor >= threshold (kalibrasi di val, bukan test)

output:
  dir: outputs/baseline
