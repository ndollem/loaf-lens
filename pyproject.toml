[project]
name = "loaflens"
version = "0.0.1"
description = "POC visi komputer low-cost untuk mendeteksi roti kempes di konveyor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    # Build dengan GUI (cv2.imshow) untuk demo real-time M4 (keputusan user, ganti dari
    # opencv-python-headless). Jangan pasang keduanya bersamaan (bentrok modul cv2).
    "opencv-python",
    "scikit-learn",
    "pyyaml",
    # Scorer B (M3): backbone ResNet18 beku sebagai feature extractor. Wajib build CPU —
    # `make setup`/`make lock` memakai `uv --torch-backend cpu` (lihat README).
    "torch>=2.14",
    "torchvision>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loaflens"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
